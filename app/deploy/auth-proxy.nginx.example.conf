# 無効なサンプル（未適用）。認証プロキシ（サイドカー）の提案であり、検証済みの構成ではない。
# 認証の領域・アカウントとネットワークは、配置する環境に合わせる（README.md の trusted-proxy の節）。
#
# 役割: 既存のエッジのリバースプロキシ（TLS 終端）から届いた要求を認証し、アプリへ
#       単一の上書き済み識別ヘッダー X-Mail-User だけを付けて転送する。
# 注意: nginx の proxy_set_header は、その階層で 1 つでも定義すると外側の定義を継承しない。
#       そのため転送する location の中に、必要なヘッダーをすべて定義している。
#       ヘッダーを設定する location を増やす場合は、同じ一式を各 location に書くこと。

server {
    # 内部ネットワークだけで待ち受ける。ホストへのポート公開はしない。
    listen 8081;
    server_name mail.example.invalid;

    client_max_body_size 64k;

    location / {
        auth_basic "shared-mail-manager";
        # 運用者ローカルのファイル（Git 管理外）。パスワードファイルをリポジトリに置かない。
        auth_basic_user_file /etc/nginx/smm.htpasswd;

        # 公開ホスト名を保つ（アプリは正規の Host 以外を 421 で拒否する）。
        proxy_set_header Host $host;
        # 認証済みの利用者名で上書きする。クライアントが送った同名ヘッダーは転送されない。
        proxy_set_header X-Mail-User $remote_user;
        # パスワードや他の資格情報をアプリへ渡さない。
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        # アプリは転送系ヘッダーを使わないが、念のため渡さない。
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # アプリ コンテナの内部アドレス（ホストに公開しない）。
        proxy_pass http://172.30.57.10:8080;
    }
}
